<style>
.cairo-stage {
  --speed: 0.6s;
  --shake-intensity: 4px;
  --bg-theme: #1a052e;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "ZCOOL KuaiLe", "Noto Sans SC", "Noto Sans JP", Impact, "Arial Black", sans-serif;
  user-select: none;
  background: radial-gradient(ellipse at 50% 0%, #3a0a5c 0%, #090212 55%, #05010a 100%);
  padding: 18px 12px 28px;
}
.cairo-stage .scene-heading { text-align: center; margin-bottom: 14px; max-width: min(1100px, 96vw); }
.cairo-stage .scene-heading h1 {
  font-size: clamp(1.35rem, 3.4vw, 2.4rem);
  letter-spacing: 0.08em;
  color: #ffe600;
  text-shadow: 0 0 12px rgba(255, 230, 0, 0.55), 3px 3px 0 #7a0044;
  line-height: 1.25;
}
.cairo-stage .scene-heading p { margin-top: 6px; color: #dda8ff; font-size: 0.92rem; letter-spacing: 0.12em; }
.cinema-container {
  position: relative;
  width: min(1100px, 96vw);
  aspect-ratio: 16 / 9;
  background: var(--bg-theme);
  border: 5px solid #ffe600;
  box-shadow: 0 0 40px rgba(255, 230, 0, 0.4), 0 0 90px rgba(162, 0, 255, 0.5);
  overflow: hidden;
  border-radius: 8px;
  transition: filter 0.3s ease;
}
.cinema-container.jojo-palette { filter: invert(0.9) hue-rotate(190deg) contrast(1.3); }
.cinema-container.turbo { --speed: 0.25s; --shake-intensity: 9px; }
.cinema-container.honking { --shake-intensity: 12px; }
.screen-shake { width: 100%; height: 100%; animation: rumble var(--speed) linear infinite; }
@keyframes rumble {
  0% { transform: translate(0, 0) rotate(0deg); }
  20% { transform: translate(calc(-1 * var(--shake-intensity)), var(--shake-intensity)) rotate(-0.5deg); }
  40% { transform: translate(var(--shake-intensity), calc(-1 * var(--shake-intensity))) rotate(0.5deg); }
  60% { transform: translate(calc(-0.5 * var(--shake-intensity)), calc(-1 * var(--shake-intensity))); }
  80% { transform: translate(var(--shake-intensity), var(--shake-intensity)) rotate(-0.3deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}
.cinema-container svg { width: 100%; height: 100%; display: block; }
.pavement-slide { animation: slideGround var(--speed) linear infinite; }
@keyframes slideGround { 0% { transform: translateX(0); } 100% { transform: translateX(-400px); } }
.bg-scroll { animation: bgMove 6s linear infinite; }
@keyframes bgMove { 0% { transform: translateX(0); } 100% { transform: translateX(-300px); } }
.car-bounce { transform-origin: 50% 80%; animation: carJolting calc(var(--speed) * 0.7) ease-in-out infinite alternate; }
@keyframes carJolting {
  0% { transform: translate(0, 0) rotate(-1deg); }
  50% { transform: translate(2px, -8px) rotate(1.2deg); }
  100% { transform: translate(-3px, 6px) rotate(-1.5deg); }
}
.wheel-spin { transform-origin: center; transform-box: fill-box; animation: wheelRotate 0.12s linear infinite; }
@keyframes wheelRotate { 100% { transform: rotate(360deg); } }
.senator-panic { transform-origin: 570px 380px; animation: panicShake 0.08s linear infinite; }
@keyframes panicShake {
  0% { transform: translate(0, 0) rotate(0); }
  50% { transform: translate(-3px, 2px) rotate(-1.5deg); }
  100% { transform: translate(3px, -1px) rotate(1.5deg); }
}
.sweat-drop { animation: sweatFly 0.4s ease-out infinite; }
@keyframes sweatFly {
  0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
  100% { opacity: 0; transform: translate(-70px, -40px) scale(1.6); }
}
.dio-menace { transform-origin: 430px 340px; animation: dioSway 2s ease-in-out infinite alternate; }
@keyframes dioSway {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-4px) rotate(1deg); }
}
.debris-watermelon { animation: flyingMelon calc(var(--speed) * 1.6) cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
@keyframes flyingMelon {
  0% { transform: translate(0, 0) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translate(380px, -360px) rotate(720deg); opacity: 0; }
}
.debris-crate { animation: flyingCrate calc(var(--speed) * 1.3) cubic-bezier(0.1, 0.7, 0.1, 1) infinite; animation-delay: 0.15s; }
@keyframes flyingCrate {
  0% { transform: translate(0, 0) rotate(0); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(320px, -240px) rotate(-540deg); opacity: 0; }
}
.debris-pedestrian { animation: flyingPedestrian calc(var(--speed) * 2.2) cubic-bezier(0.15, 0.85, 0.35, 1.2) infinite; animation-delay: 0.3s; }
@keyframes flyingPedestrian {
  0% { transform: translate(0, 0) scale(0.8) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translate(450px, -320px) scale(1.3) rotate(360deg); opacity: 0; }
}
.speed-strip { animation: speedFade 0.2s linear infinite alternate; }
@keyframes speedFade {
  0% { opacity: 0.3; transform: scaleX(0.9); }
  100% { opacity: 0.95; transform: scaleX(1.1); }
}
.menace-text {
  font-family: "Permanent Marker", "Noto Sans JP", "ZCOOL KuaiLe", cursive;
  fill: #a728ff; stroke: #ffec3d; stroke-width: 2px;
  filter: drop-shadow(0 0 10px #e024c3);
  animation: gogogo 1.5s ease-in-out infinite;
}
.menace-text:nth-child(2) { animation-delay: 0.4s; }
.menace-text:nth-child(3) { animation-delay: 0.8s; }
.menace-text:nth-child(4) { animation-delay: 1.1s; }
@keyframes gogogo {
  0% { transform: translateY(30px) scale(0.7); opacity: 0; }
  40% { opacity: 1; }
  100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
}
.manga-bubble { animation: bubblePop 2.4s ease-in-out infinite alternate; transform-origin: 300px 140px; }
@keyframes bubblePop {
  0% { transform: scale(0.96) rotate(-1deg); }
  100% { transform: scale(1.03) rotate(1.5deg); }
}
.horn-burst { pointer-events: none; z-index: 30; animation: hornPop 2s ease-out forwards; }
@keyframes hornPop {
  0% { opacity: 0; transform: scale(0.72); }
  8% { opacity: 1; transform: scale(1.06); }
  72% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.08); }
}
.cairo-stage .controls {
  margin-top: 18px; display: flex; gap: 15px; z-index: 10;
  flex-wrap: wrap; justify-content: center; max-width: min(1100px, 96vw);
}
.cairo-stage .controls button {
  background: #ffcc00; color: #120224; border: none; outline: none;
  font-family: inherit; font-size: 16px; font-weight: 900;
  padding: 12px 24px; height: auto; border-radius: 50px; cursor: pointer;
  box-shadow: 0 5px 0 #b38f00, 0 8px 20px rgba(0, 0, 0, 0.4);
  transition: all 0.15s ease; white-space: nowrap;
}
.cairo-stage .controls button:hover {
  background: #ffe066; color: #120224; transform: translateY(-2px);
  box-shadow: 0 7px 0 #b38f00, 0 12px 25px rgba(255, 204, 0, 0.5);
}
.cairo-stage .controls button:active { transform: translateY(4px); box-shadow: 0 1px 0 #b38f00; }
.cairo-stage .controls button.is-turbo {
  background: #ff0044; color: #fff;
  box-shadow: 0 5px 0 #8a0028, 0 8px 20px rgba(255, 0, 68, 0.35);
}
.cairo-stage .controls button.is-turbo:hover {
  background: #ff3366; color: #fff;
  box-shadow: 0 7px 0 #8a0028, 0 12px 25px rgba(255, 0, 68, 0.45);
}
.cairo-stage .controls button.is-palette {
  background: #7a00ff; color: #ffe600;
  box-shadow: 0 5px 0 #43008c, 0 8px 20px rgba(122, 0, 255, 0.4);
}
.cairo-stage .controls button.is-palette:hover {
  background: #9240ff; color: #ffe600;
  box-shadow: 0 7px 0 #43008c, 0 12px 25px rgba(122, 0, 255, 0.5);
}
.cairo-stage .controls button.is-honking {
  background: #ff7a00; color: #120224;
  box-shadow: 0 5px 0 #b34700, 0 8px 20px rgba(255, 122, 0, 0.45);
}
.quote-hint {
  margin-top: 10px; color: #ccaadd; font-size: 14px; letter-spacing: 1px;
  text-align: center; max-width: min(1100px, 96vw); padding: 0 8px;
}
@media (max-width: 720px) {
  .cairo-stage .controls button { font-size: 14px; padding: 10px 16px; }
  .cairo-stage .scene-heading p { letter-spacing: 0.04em; }
}

<script>
const box = document.getElementById("cinemaBox");
const turboBtn = document.getElementById("turboBtn");
const paletteBtn = document.getElementById("paletteBtn");
const hornBtn = document.getElementById("hornBtn");
let turbo = false;
let palette = false;
let hornTimer = null;
turboBtn.addEventListener("click", () => {
  turbo = !turbo;
  box.classList.toggle("turbo", turbo);
  turboBtn.textContent = turbo ? "⚡ 减速！减速啊啊啊！" : "🔥 猛踩油门 (加速冲撞)";
  turboBtn.classList.toggle("is-turbo", turbo);
});
paletteBtn.addEventListener("click", () => {
  palette = !palette;
  box.classList.toggle("jojo-palette", palette);
  paletteBtn.textContent = palette ? "🎨 恢复开罗夜色" : "🎨 JOJO处刑曲变色 (COLOR SHIFT)";
  paletteBtn.classList.toggle("is-palette", palette);
});
function playHorn() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const audioCtx = new AudioCtx();
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = "sawtooth";
    osc2.type = "triangle";
    osc1.frequency.setValueAtTime(370, audioCtx.currentTime);
    osc2.frequency.setValueAtTime(440, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start();
    osc2.start();
    osc1.stop(audioCtx.currentTime + 0.45);
    osc2.stop(audioCtx.currentTime + 0.45);
    setTimeout(() => audioCtx.close(), 600);
  } catch (e) {}
}
hornBtn.addEventListener("click", () => {
  playHorn();
  box.classList.add("honking");
  hornBtn.classList.add("is-honking");
  hornBtn.textContent = "📢 快闪开！！";
  const burst = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  burst.setAttribute("class", "horn-burst");
  burst.setAttribute("viewBox", "0 0 1200 675");
  burst.setAttribute("aria-hidden", "true");
  burst.style.position = "absolute";
  burst.style.inset = "0";
  burst.style.width = "100%";
  burst.style.height = "100%";
  burst.innerHTML = '<rect width="1200" height="675" fill="#fff8c8" opacity="0.28"></rect><polygon points="430,90 510,55 590,85 670,40 760,90 850,70 830,150 920,210 820,240 850,330 740,300 680,390 610,310 520,360 530,270 430,260 490,190 390,150 480,120" fill="#fff" stroke="#ff0044" stroke-width="8"></polygon><text x="640" y="195" fill="#d6002f" font-size="64" font-weight="900" text-anchor="middle">快闪开！</text><text x="640" y="255" fill="#111" font-size="36" font-weight="900" text-anchor="middle">HONK HONK</text>';
  const old = box.querySelector(".horn-burst");
  if (old) old.remove();
  box.appendChild(burst);
  if (hornTimer) clearTimeout(hornTimer);
  hornTimer = setTimeout(() => {
    burst.remove();
    box.classList.remove("honking");
    hornBtn.classList.remove("is-honking");
    hornBtn.textContent = "📢 鸣笛：“快闪开！”";
    hornTimer = null;
  }, 2000);
});
</script>
